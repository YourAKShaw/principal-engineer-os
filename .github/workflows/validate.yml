name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate the skill package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The validator supports Python 3.9+ with the standard library only.
          python-version: "3.13"
      - name: Validate the package
        run: python3 scripts/validate-skill.py
      - name: Run the validator regression suite
        run: python3 scripts/test_validate_skill.py

  commits:
    name: Check commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check commit messages
        # Dependabot writes its own messages and cannot add the required trailers.
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TRAILER: "Co-Authored-By: Claude Code <noreply@anthropic.com>"
        run: |
          # A new branch or manual run has no base; check only the head commit.
          if [ -z "${BASE//0/}" ]; then
            commits="$HEAD"
          else
            commits=$(git rev-list --no-merges "$BASE..$HEAD")
          fi
          status=0
          for sha in $commits; do
            # Merged Dependabot pull requests reach main with Dependabot as author.
            if [ "$(git log -1 --format=%an "$sha")" = "dependabot[bot]" ]; then
              continue
            fi
            echo "$(git log -1 --format='%h %s' "$sha")"
            git log -1 --format=%B "$sha" | python3 .github/scripts/lint-commit.py --trailer "$TRAILER" - || status=1
          done
          exit $status
